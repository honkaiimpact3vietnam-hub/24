<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Học web chuẩn</title>
    <link rel="stylesheet" href="24.css">
</head>
<body>

    <section class="contact-form">
        <h2>Get in touch with us by filling contact form below</h2>
        
        <form action="#" method="post">
            <p>
                <input type="text" name="name" class="half-size" placeholder="Enter your full name">
                <input type="email" name="email" class="half-size" placeholder="Enter your email address">
            </p>
            
            <p>
                <input type="text" name="subject" class="full-size" placeholder="Enter your subject">
            </p>
            
            <p>
                <textarea name="message" class="full-size" placeholder="Your message here" rows="10" cols="58"></textarea>
            </p>
            
            <p class="submit">
                <button type="submit"><span>Send message</span></button>
                <span>Please fill all required form fields, thanks!</span>
            </p>
        </form>
    </section>

</body>
</html>
